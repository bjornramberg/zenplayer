[project]
name = "zenplayer"
version = "0.1.2"
description = "Minimal terminal YouTube Music client with album art now-playing display"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "textual>=0.41.0",
    "yt-dlp>=2023.0.0",
    "numpy>=1.24.0",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/bjornramberg/zenplayer"
Repository = "https://github.com/bjornramberg/zenplayer"
Issues = "https://github.com/bjornramberg/zenplayer/issues"

[project.scripts]
zenplayer = "zenplayer.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zenplayer"
version = "0.1.0"
description = "Minimal terminal YouTube Music client with circular audio visualizer"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.41.0",
    "yt-dlp>=2023.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
zenplayer = "zenplayer.__main__:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
